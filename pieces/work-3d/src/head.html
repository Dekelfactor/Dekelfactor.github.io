const DURATION = 40.0;

const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const HAND = '"Inter", "Segoe UI", Arial, sans-serif';
const CX = 470;

const ERA_LIST = [
  [0, 7.0, () => sceneHook()],
  [7.0, 9.5, () => scenePromise()],
  [9.5, 25.0, () => sceneStory()],
  [25.0, 36.0, () => sceneHow()],
  [36.0, 40.0, () => sceneCTA()],
];
