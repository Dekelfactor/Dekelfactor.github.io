<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.head { position: absolute; top: var(--safe-top); left: 0; right: 0; height: 52px; display: flex; align-items: center; padding: 0 6px 0 4px; gap: 2px; }
.title { flex: 1; min-width: 0; }
.title b { display: block; font: 400 21px/1.05 var(--serif); letter-spacing: -0.01em; }
.title span { font-size: 11.5px; color: var(--ink-3); }
.stage { position: absolute; top: 99px; left: 0; right: 0; height: 300px; background: radial-gradient(ellipse 70% 80% at 50% 50%, #221d18, var(--char-0)); display: grid; place-items: center; }
.frame { width: 162px; height: 288px; border-radius: 6px; overflow: hidden; position: relative; box-shadow: 0 0 0 1px var(--line-2); }
.frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
.frame .safe { position: absolute; inset: 8%; border: 1px dashed rgba(237,228,214,.22); border-radius: 3px; }
.aspect { position: absolute; left: 12px; bottom: 4px; display: flex; gap: 0; }
.aspect button { height: 44px; min-width: 44px; display: grid; place-items: center; }
.aspect span { height: 30px; padding: 0 10px; border-radius: 8px; display: grid; place-items: center; font: 500 11.5px/1 var(--sans); color: var(--ink-3); }
.aspect .on span { color: var(--ink); background: var(--char-2); }
.draft { position: absolute; right: 12px; bottom: 4px; padding: 0 4px; font-size: 11.5px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; height: 44px; }
.sw { width: 26px; height: 16px; border-radius: 8px; background: var(--char-3); position: relative; }
.sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink-2); }
.transport { position: absolute; top: 399px; left: 0; right: 0; height: 52px; display: flex; align-items: center; padding: 0 8px; border-top: 1px solid var(--line); }
.tc { font-size: 12.5px; color: var(--ink); width: 92px; padding-left: 8px; white-space: nowrap; }
.tc i { font-style: normal; color: var(--ink-3); }
.playbtn { width: 48px; height: 48px; border-radius: 50%; background: var(--ink); color: var(--char-0); display: grid; place-items: center; margin: 0 auto; }
.playbtn svg { width: 20px; height: 20px; margin-left: 3px; }

.tl { position: absolute; top: 451px; left: 0; right: 0; height: 296px; background: var(--char-1); border-top: 1px solid var(--line); overflow: hidden; }
.ruler { height: 24px; position: relative; margin-left: 44px; border-bottom: 1px solid var(--line); }
.ruler span { position: absolute; top: 6px; font: 400 10px/1 var(--mono); color: var(--ink-3); }
.ruler i { position: absolute; bottom: 0; width: 1px; height: 5px; background: var(--ink-3); }
.track { position: relative; display: flex; align-items: center; margin-top: 6px; }
.th { width: 44px; height: 100%; display: grid; place-items: center; color: var(--ink-3); flex: none; }
.th svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.lane { position: relative; flex: 1; height: 100%; }
.clip { position: absolute; top: 0; bottom: 0; border-radius: 7px; overflow: hidden; display: flex; align-items: center; font: 500 11.5px/1 var(--sans); padding: 0 9px; gap: 6px; white-space: nowrap; }
.film { display: flex; padding: 0; }
.film img { height: 100%; width: auto; display: block; opacity: .95; }
.sel { box-shadow: 0 0 0 2px var(--accent); }
.sel::before, .sel::after { content: ''; position: absolute; top: 0; bottom: 0; width: 10px; background: var(--accent); z-index: 2; }
.sel::before { left: 0; border-radius: 7px 0 0 7px; } .sel::after { right: 0; border-radius: 0 7px 7px 0; }
.c3d { background: #3a3128; color: var(--ink); }
.ctext { background: #2f2a33; color: var(--ink); }
.cam { background: transparent; border: 1px solid var(--line-2); color: var(--ink-2); }
.wave { background: #252c27; }
.wave svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.playhead { position: absolute; top: 0; bottom: 0; left: 176px; width: 2px; background: var(--accent); z-index: 5; }
.playhead::before { content: ''; position: absolute; top: 0; left: -6px; width: 14px; height: 14px; background: var(--accent); clip-path: polygon(0 0, 100% 0, 100% 55%, 50% 100%, 0 55%); }
.tools { position: absolute; left: 0; right: 0; bottom: 0; height: calc(64px + var(--safe-bottom)); background: var(--char-0); border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding: 4px 6px 0; }
.tool { width: 64px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: var(--ink-3); font-size: 10.5px; border-radius: 12px; }
.tool svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tool.on { color: var(--ink); }
.tool.on svg { color: var(--accent); }
</style></head><body>
<main class="phone">
  <header class="head">
    <button class="ib" aria-label="Back to projects" data-i="back"></button>
    <div class="title"><b>Studio reveal</b><span>Saved just now</span></div>
    <button class="ib" aria-label="Undo" data-i="undo"></button>
    <button class="ib" aria-label="Redo" data-i="redo"></button>
    <button class="pill btn-accent" style="margin-left:4px" aria-label="Export video">Export</button>
  </header>

  <section class="stage grain" aria-label="Preview">
    <div class="frame"><img src="assets/hero.png" alt=""><div class="safe"></div></div>
    <div class="aspect" role="radiogroup" aria-label="Aspect ratio"><button class="on" role="radio" aria-checked="true"><span>9:16</span></button><button role="radio" aria-checked="false"><span>1:1</span></button><button role="radio" aria-checked="false"><span>16:9</span></button></div>
    <button class="draft" role="switch" aria-checked="false">Draft <span class="sw"></span></button>
  </section>

  <div class="transport">
    <div class="tc mono" aria-label="Playhead at 2.14 seconds of 6">00:02.14</div>
    <button class="ib" aria-label="Split clip" data-i="split"></button>
    <button class="playbtn" aria-label="Play"><svg aria-hidden="true"><use href="#i-play"/></svg></button>
    <button class="ib" aria-label="Add keyframe" style="color:var(--accent)" data-i="diamond"></button>
    <button class="ib" aria-label="Add layer" data-i="plus"></button>
  </div>

  <section class="tl" aria-label="Timeline">
    <div class="ruler" id="ruler"></div>
    <div class="playhead" style="height:100%"></div>
    <div class="track" style="height:48px"><div class="th" data-i="film"></div><div class="lane">
      <div class="clip film sel" style="left:4px;width:300px" id="film"></div></div></div>
    <div class="track" style="height:34px"><div class="th" data-i="cube"></div><div class="lane">
      <div class="clip c3d" style="left:30px;width:250px">DF monogram.glb</div>
      <span class="kf on" style="left:128px"></span><span class="kf" style="left:206px"></span><span class="kf" style="left:262px"></span></div></div>
    <div class="track" style="height:30px"><div class="th" data-i="text"></div><div class="lane">
      <div class="clip ctext" style="left:110px;width:190px">Made by hand</div></div></div>
    <div class="track" style="height:30px"><div class="th" data-i="camera"></div><div class="lane">
      <div class="clip cam" style="left:4px;width:318px">Slow dolly in</div>
      <span class="kf on" style="left:128px"></span><span class="kf" style="left:300px"></span></div></div>
    <div class="track" style="height:30px"><div class="th" data-i="light"></div><div class="lane">
      <div class="clip cam" style="left:4px;width:318px">Key, fill, rim</div>
      <span class="kf" style="left:176px"></span><span class="kf" style="left:262px"></span></div></div>
    <div class="track" style="height:36px"><div class="th" data-i="audio"></div><div class="lane">
      <div class="clip wave" style="left:4px;width:330px"><svg id="wave" preserveAspectRatio="none" viewBox="0 0 330 36"></svg></div></div></div>
  </section>

  <nav class="tools" aria-label="Tools">
    <button class="tool on" data-i="layers">Edit</button>
    <button class="tool" data-i="curve">Motion</button>
    <button class="tool" data-i="camera">Camera</button>
    <button class="tool" data-i="light">Light</button>
    <button class="tool" data-i="fx">Effects</button>
  </nav>
</main>
<script src="chrome.js"></script>
<script>
const f = document.getElementById('film'); for (let i = 0; i < 7; i++) f.insertAdjacentHTML('beforeend', `<img src="assets/strip${i}.png" alt="">`);
const r = document.getElementById('ruler'); for (let s = 0; s <= 6; s++) { const x = 4 + s * 54; r.insertAdjacentHTML('beforeend', `<span style="left:${x+3}px">${s}s</span><i style="left:${x}px;height:8px"></i><i style="left:${x+27}px"></i>`); }
const w = document.getElementById('wave'); let d = ''; for (let x = 2; x < 330; x += 3) { const a = 4 + Math.abs(Math.sin(x * .09) * Math.cos(x * .023)) * 13 + (x % 7) * .4; d += `M${x} ${18 - a}V${18 + a}`; }
w.innerHTML = `<path d="${d}" stroke="rgba(237,228,214,.42)" stroke-width="1.6" stroke-linecap="round"/>`;
</script>
</body></html>
