//  DEKEL FACTOR DESIGNS — THE WORK. 9:16, 40.0s @ 120 BPM, 24fps. Morph chain through a ring:

const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 40.0;

const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const HAND = '"Inter", "Segoe UI", Arial, sans-serif';
const CX = 470;

const ERA_LIST = [
  [0, 19.5, () => sceneStory()],
  [19.5, 24.5, () => scenePromise()],
  [24.5, 36.0, () => sceneHow()],
  [36.0, 40.0, () => sceneCTA()],
];
