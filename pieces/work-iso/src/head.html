//  DEKEL FACTOR DESIGNS — THE WORK. 9:16, 40.0s @ 120 BPM, 24fps. Morph chain through a ring:

// =====================================================================

const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 40.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const HAND = '"Inter", "Segoe UI", Arial, sans-serif';
const CX = 470;

const ERA_LIST = [
  [0, 4.0, () => sceneIntro()],
  [4.0, 20.5, () => sceneOSJ()],
  [20.5, 36.5, () => sceneSeason()],
  [36.5, 40.0, () => scenePayoff()],
];
const SHOTS = [
  ['intro',   0, 0.0,  4.0,  'the ring in the dark; Paper-me peeks through; the thesis line'],

];
